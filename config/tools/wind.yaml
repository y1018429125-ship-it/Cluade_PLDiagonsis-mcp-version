tool:
  name: "WindDiagnosisTool"
  display_name: "风偏诊断"
  description: "查询线路走廊故障时刻的风速数据，分析风偏故障风险"
  category: "environmental"
  adapter:
    type: "mcp"
    config:
      url: "http://localhost:8003"
      timeout: 30
  output_schema:
    type: "structured"
    fields:
      - name: "wind_speed_ms"
        type: "float"
        description: "故障时刻风速(m/s)"
      - name: "wind_description"
        type: "string"
        description: "风速级别语言描述"
      - name: "details"
        type: "object"
        description: "附加信息（query_date、trip_id）"
  report_mapping:
    chapter: "诊断证据"
    render_template: "table"
