tool:
  name: "LightningDiagnosisTool"
  display_name: "雷电定位"
  description: "查询线路走廊附近雷电活动数据，包括雷击时间、位置、电流强度等"
  category: "electrical"
  adapter:
    type: "mcp"
    config:
      url: "http://localhost:8001"
      timeout: 30
  output_schema:
    type: "structured"
    fields:
      - name: "fault_type"
        type: "string"
        description: "故障类型判定（如 雷击-绕击）"
      - name: "confidence"
        type: "float"
        description: "诊断置信度(0~1)"
      - name: "evidence"
        type: "list"
        description: "各诊断模块证据列表"
      - name: "details"
        type: "object"
        description: "附加信息（query_date、trip_id、images、module_scores）"
  report_mapping:
    chapter: "诊断证据"
    render_template: "table"
