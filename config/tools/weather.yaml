tool:
  name: "WeatherDiagnosisTool"
  display_name: "微气象诊断"
  description: "查询线路走廊故障时刻的温度和湿度数据，分析气象环境条件"
  category: "environmental"
  adapter:
    type: "mcp"
    config:
      url: "http://localhost:8005"
      timeout: 30
  output_schema:
    type: "structured"
    fields:
      - name: "temperature_c"
        type: "float"
        description: "故障时刻温度(°C)"
      - name: "humidity_pct"
        type: "float"
        description: "故障时刻湿度(%)"
      - name: "humidity_description"
        type: "string"
        description: "湿度级别语言描述"
      - name: "details"
        type: "object"
        description: "附加信息（query_date、trip_id）"
  report_mapping:
    chapter: "诊断证据"
    render_template: "table"
